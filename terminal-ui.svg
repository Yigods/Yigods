<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
       .cyber-terminal {
          background: linear-gradient(135deg, #0D1117, #000000);
          border: 2px solid #00FF00;
          box-shadow: 0 0 15px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.1);
          border-radius: 4px;
          padding: 25px;
          font-family: 'Hack', 'Courier New', monospace;
          color: #00FF00;
          position: relative;
          overflow: hidden;
        }
        /* 模拟老式显示器的扫描线效果 */
       .cyber-terminal::after {
          content: " ";
          display: block;
          position: absolute;
          top: 0; left: 0; bottom: 0; right: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
          z-index: 2;
          background-size: 100% 2px, 3px 100%;
          pointer-events: none;
        }
       .text-glow { text-shadow: 0 0 5px #00FF00; }
        /* 关键帧实现故障文字与闪烁光标 */
       .glitch-anim { animation: textGlitch 2s infinite; }
       .cursor { display: inline-block; width: 10px; height: 1.2em; background-color: #00FF00; animation: blink 1s step-end infinite; vertical-align: bottom; }
        @keyframes textGlitch {
          0% { transform: translate(0) }
          20% { transform: translate(-2px, 1px) }
          40% { transform: translate(-1px, -1px) }
          60% { transform: translate(2px, 1px) }
          80% { transform: translate(1px, -1px) }
          100% { transform: translate(0) }
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      </style>
      
      <div class="cyber-terminal">
        <h2 class="text-glow">> SYSTEM_IDENTITY_CHECK:</h2>
        <p>> INITIALIZING CYBER-PROTOCOL v2.4.1... OK</p>
        <p>> ESTABLISHING SECURE CONNECTION... OK</p>
        <p>> OVERRIDING MAIN DIRECTIVE... <span style="color: #EC3750;">ACCESS GRANTED</span></p>
        <p>> WAITING FOR COMMAND <span class="cursor"></span></p>
      </div>
    </div>
  </foreignObject>
</svg>
