<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yigod — binary security researcher</title>
  <desc id="desc">A dark terminal-inspired profile header.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101a1d"/>
      <stop offset="100%" stop-color="#0b1314"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="20%" stop-color="#3fb950"/>
      <stop offset="80%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#3fb950" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="304" rx="12" fill="#0d1117" fill-opacity=".76" stroke="#3fb950" stroke-opacity=".5"/>
  <path d="M 29 82 H1171" stroke="#3fb950" stroke-opacity=".28"/>
  <circle cx="57" cy="55" r="7" fill="#ff7b72"/>
  <circle cx="81" cy="55" r="7" fill="#e3b341"/>
  <circle cx="105" cy="55" r="7" fill="#3fb950"/>
  <text x="132" y="61" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">yigod@security-lab:~</text>
  <text x="74" y="126" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" filter="url(#glow)">$ whoami</text>
  <text x="74" y="170" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700">Yigod</text>
  <text x="74" y="211" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">binary security researcher · CTF player</text>
  <text x="74" y="260" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">$ focus --current</text>
  <text x="310" y="260" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">pwn · reverse engineering · kernel exploitation</text>
  <rect x="74" y="286" width="1052" height="2" fill="url(#line)"/>
  <text x="74" y="316" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">STATUS: learning by building, debugging and reproducing</text>
</svg>
