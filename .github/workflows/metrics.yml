name: Update profile metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    name: Generate profile SVG metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: General profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/general.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update profile metrics"
          config_timezone: Asia/Shanghai
          config_display: large
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

      - name: Languages overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/languages.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update profile metrics"
          config_timezone: Asia/Shanghai
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, shell, jupyter notebook

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics/isocalendar.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update profile metrics"
          config_timezone: Asia/Shanghai
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

